version: 2

# Keep both npm trees visible to the advisory feed. The repository has two
# independent lockfiles (the web app at / and the Functions package at
# /functions), so both must be listed; a single entry would silently miss the
# Functions findings that took the release gate down in November 2026.
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:00'
      timezone: 'Asia/Kuala_Lumpur'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
    groups:
      production-minor-and-patch:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      development-minor-and-patch:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'npm'
    directory: '/functions'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:00'
      timezone: 'Asia/Kuala_Lumpur'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps-functions)'
    labels:
      - 'dependencies'
    groups:
      production-minor-and-patch:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '08:00'
      timezone: 'Asia/Kuala_Lumpur'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - 'dependencies'

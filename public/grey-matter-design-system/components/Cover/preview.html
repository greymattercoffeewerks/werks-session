<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<style>
  html,body{margin:0}
  body{width:960px;height:304px;background:var(--gm-cream);position:relative;overflow:hidden;font-family:var(--gm-font-text)}
  svg{display:block}
  .b1,.b6{fill:var(--gm-charcoal)} .b2{fill:var(--gm-teal)} .b3{fill:var(--gm-teal-tint)} .b4{fill:var(--cert-red)} .b5{fill:var(--cert-grey)} .cut{fill:var(--gm-cream)}
  .name{position:absolute;left:32px;top:120px;margin:0;font-family:var(--gm-font-display);font-weight:800;font-size:64px;line-height:.95;letter-spacing:-.02em;color:var(--gm-charcoal)}
  .tag{position:absolute;left:32px;top:256px;margin:0;font:var(--gm-w-regular) 14px/1.2 var(--gm-font-text);color:var(--gm-grey)}
</style></head>
<body>
<svg width="960" height="96" viewBox="0 0 960 96" role="img" aria-label="Palette band: charcoal, teal, teal tint, red, grey and charcoal blocks with a sawtooth lower edge">
  <!-- blocks: charcoal 4×64, teal 3×64, teal-tint 2×64, cert-red 2×64, cert-grey 2×64, charcoal 2×64 at 96px tall (space-16, space-24).
       arrangement: top band of unequal strips, as the label strips run on the packaging, bleeding off both sides.
       pattern: fifteen ground-coloured triangles at a 64px pitch cut a sawtooth edge — the triangle border of the refreshed certificate; geometric and loud, picked over rules because the new identity composes in triangles.
       scales: pitch space-16 (64), band space-24 (96), tooth height space-8 (32), corners square (radius-none). -->
  <g>
    <rect class="b1" x="0" y="0" width="256" height="96"/>
    <rect class="b2" x="256" y="0" width="192" height="96"/>
    <rect class="b3" x="448" y="0" width="128" height="96"/>
    <rect class="b4" x="576" y="0" width="128" height="96"/>
    <rect class="b5" x="704" y="0" width="128" height="96"/>
    <rect class="b6" x="832" y="0" width="128" height="96"/>
  </g>
  <g>
    <polygon class="cut" points="0,96 64,96 32,64"/>
    <polygon class="cut" points="64,96 128,96 96,64"/>
    <polygon class="cut" points="128,96 192,96 160,64"/>
    <polygon class="cut" points="192,96 256,96 224,64"/>
    <polygon class="cut" points="256,96 320,96 288,64"/>
    <polygon class="cut" points="320,96 384,96 352,64"/>
    <polygon class="cut" points="384,96 448,96 416,64"/>
    <polygon class="cut" points="448,96 512,96 480,64"/>
    <polygon class="cut" points="512,96 576,96 544,64"/>
    <polygon class="cut" points="576,96 640,96 608,64"/>
    <polygon class="cut" points="640,96 704,96 672,64"/>
    <polygon class="cut" points="704,96 768,96 736,64"/>
    <polygon class="cut" points="768,96 832,96 800,64"/>
    <polygon class="cut" points="832,96 896,96 864,64"/>
    <polygon class="cut" points="896,96 960,96 928,64"/>
  </g>
</svg>
<h1 class="name">Grey Matter<br>Coffee Werks</h1>
<p class="tag">Brunei's boutique dedicated coffee partner.</p>
</body></html>

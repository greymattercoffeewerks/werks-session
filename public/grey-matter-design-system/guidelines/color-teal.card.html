<!-- @dsCard group="Colors" viewport="700x150" name="Brand teal" subtitle="Brand-only — never a bean colour, never decoration" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--gm-cream);font-family:var(--gm-font-text);padding:18px;display:flex;gap:16px;align-items:stretch;}
  .big{flex:1.2;background:var(--gm-teal);border-radius:4px;color:var(--gm-cream);padding:14px;display:flex;flex-direction:column;justify-content:space-between;min-height:96px;}
  .n{font:var(--gm-w-heavy) 20px/1 var(--gm-font-display);}
  .h{font:var(--gm-w-regular) 11px/1.4 var(--gm-font-text);}
  .side{flex:1;display:flex;flex-direction:column;gap:8px;}
  .sw{flex:1;border-radius:4px;padding:9px 11px;display:flex;justify-content:space-between;align-items:center;font:var(--gm-w-semi) 11px/1 var(--gm-font-text);}
  .note{font:var(--gm-w-regular) 11px/1.4 var(--gm-font-text);color:var(--gm-grey-2);align-self:center;max-width:150px;}
</style></head>
<body>
<div class="big"><span class="n">teal</span><span class="h">#3B96A4 · the "Grey Matter" colour</span></div>
<div class="side">
  <div class="sw" style="background:var(--gm-teal-deep);color:var(--gm-cream)"><span>teal-deep</span><span>#15707D</span></div>
  <div class="sw" style="background:var(--gm-teal-tint);color:var(--gm-teal-deep)"><span>teal-tint</span><span>#DDEEF0</span></div>
</div>
<div class="note">Reserved for logo, About Us, judge &amp; competition content. Not for general accents.</div>
</body></html>

<!-- @dsCard group="Type" viewport="700x180" name="Casing rule" subtitle="Caps for brand/UI · lowercase for editorial bean names" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--gm-cream);font-family:var(--gm-font-text);padding:20px;color:var(--gm-charcoal);display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .cell{border-radius:4px;box-shadow:inset 0 0 0 1px var(--gm-cream-3);padding:16px;}
  .k{font:var(--gm-w-semi) 11px/1 var(--gm-font-text);letter-spacing:.14em;text-transform:uppercase;color:var(--gm-grey-2);margin-bottom:12px;}
  .caps{font:var(--gm-w-heavy) 30px/1 var(--gm-font-display);text-transform:uppercase;letter-spacing:.03em;}
  .low{font:var(--gm-w-heavy) 34px/0.95 var(--gm-font-display);text-transform:lowercase;letter-spacing:-.01em;}
  .why{font:var(--gm-w-regular) 12px/1.4 var(--gm-font-text);color:var(--gm-grey-2);margin-top:10px;}
</style></head>
<body>
<div class="cell">
  <div class="k">ALL-CAPS — brand &amp; UI</div>
  <div class="caps">COFFEE WERKS</div>
  <div class="why">Wordmark, navigation, buttons, labels. Tracked +0.02–0.14em.</div>
</div>
<div class="cell">
  <div class="k">lowercase — editorial</div>
  <div class="low">mana saja</div>
  <div class="why">Bean names & hero words on tiles. Tight tracking. Pick ONE casing per piece.</div>
</div>
</body></html>
